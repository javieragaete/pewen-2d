<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pewén</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: #202522; color: #e6e7d8; font: 16px Consolas, "Courier New", monospace; }
    main { width: min(100vw, 1280px); }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    p { text-align: center; padding: 1rem; }
  </style>
</head>
<body>
  <main id="juego" aria-label="Pewén">
    <p id="estado" role="status" hidden></p>
  </main>
  <script>
    window.addEventListener('error', event => {
      const estado = document.querySelector('#estado');
      if (estado) {
        estado.hidden = false;
        estado.style.cssText = 'position:fixed;inset:1rem auto auto 1rem;z-index:10;max-width:calc(100vw - 2rem);padding:1rem;background:#211d1d;color:#ffd3c9;white-space:pre-wrap;text-align:left;overflow-wrap:anywhere';
        estado.textContent = `Error al iniciar el juego: ${event.message}\n${event.filename}:${event.lineno}:${event.colno}\n${event.error?.stack || ''}`;
      }
    });
    window.addEventListener('unhandledrejection', event => {
      const estado = document.querySelector('#estado');
      if (estado) { estado.hidden = false; estado.textContent = `Error al cargar el juego: ${event.reason?.message || event.reason}`; }
    });
  </script>
  <script src="vendor/phaser.min.js"></script>
  <script src="vendor/phaser-raycaster.min.js"></script>
  <script src="vendor/rexhsladjustpipelineplugin.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
