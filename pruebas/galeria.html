<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería de arte de Pewén</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #14181a; color: #e6e7d8; font: 16px system-ui, sans-serif; }
    main { max-width: 1280px; margin: auto; padding: 24px; }
    canvas { display: block; image-rendering: pixelated; }
    #animaciones canvas { max-width: 100%; height: auto; }
    section { margin: 32px 0; }
    .muestras { display: flex; flex-wrap: wrap; gap: 20px; }
    figure { margin: 0; max-width: 100%; overflow: auto; }
    .comparacion { display: flex; width: max-content; border-bottom: 1px solid #59635b; }
    figcaption { padding: 8px 0; font-family: monospace; }
    p { color: #b9d6cf; }
  </style>
</head>
<body>
  <main>
    <h1>Galería de arte de Pewén</h1>
    <p>Escala ×3. De izquierda a derecha, fondo claro, oscuro y cielo.</p>
    <h2>Animaciones del personaje</h2>
    <div id="animaciones"></div>
    <div id="muestras"></div>
  </main>
  <script src="../vendor/phaser.min.js"></script>
  <script type="module" src="../src/arte/galeria.js"></script>
</body>
</html>
